name: Bug report / Fehlermeldung
description: Something does not work as expected. / Etwas funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or German is fine. / Danke für die Meldung! Deutsch oder Englisch ist beides recht.
  - type: textarea
    id: details
    attributes:
      label: Versions and browser / Versionen und Browser
      description: |
        In Housekeeper: Settings → Info → "Copy details for a bug report", then paste here.
        In Housekeeper: Einstellungen → Info → „Angaben für eine Fehlermeldung kopieren“, dann hier einfügen.
        Otherwise: Housekeeper version, Home Assistant version, browser or Companion app (with device).
      placeholder: "HA-Housekeeper 1.1.0, Home Assistant 2026.10.0, Safari 26 on macOS"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead? / Was hast du getan, was erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Errors from Settings → System → Logs that mention ha_housekeeper. / Fehler aus Einstellungen → System → Protokolle, die ha_housekeeper nennen.
      render: text
