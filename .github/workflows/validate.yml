name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test tools and Home Assistant
        run: python -m pip install homeassistant home-assistant-frontend pytest pytest-homeassistant-custom-component ruff
      - name: Run Ruff
        run: ruff check custom_components tests
      - name: Check formatting
        run: ruff format --check custom_components tests
      - name: Run tests
        run: python -m pytest -q --asyncio-mode=auto
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Check frontend syntax
        run: node --check custom_components/ha_housekeeper/frontend/ha-housekeeper-panel.js

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository
        uses: hacs/action@main
        with:
          category: integration
