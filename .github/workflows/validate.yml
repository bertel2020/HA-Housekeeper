name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and static checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported version (hacs.json) and whatever the test plugin pins as latest.
          # Home Assistant 2026.8 and newer need Python 3.14.
          - name: Home Assistant 2026.8.3 (minimum)
            requirements: homeassistant==2026.8.3 pytest-homeassistant-custom-component==0.13.357
          - name: Home Assistant latest
            requirements: pytest-homeassistant-custom-component
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test tools and Home Assistant
        run: python -m pip install ${{ matrix.requirements }} home-assistant-frontend ruff mypy
      - name: Run Ruff
        run: ruff check custom_components tests
      - name: Check formatting
        run: ruff format --check custom_components tests
      - name: Check types (a few modules, does not block)
        continue-on-error: true
        run: mypy
      - name: Run tests
        run: python -m pytest -q --asyncio-mode=auto
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Check that the panel bundle is built from its sources
        run: node scripts/build_panel.mjs --check
      - name: Check frontend syntax
        run: node --check custom_components/ha_housekeeper/frontend/ha-housekeeper-panel.js

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate repository
        uses: hacs/action@main
        with:
          category: integration
